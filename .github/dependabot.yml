# Mises à jour automatisées. Objectif : que la dette héritée du fork amont
# décroisse toute seule, sans noyer le dépôt sous les PR.
# Les alertes de sécurité (Dependabot security updates) sont indépendantes de
# ce fichier et restent actives quoi qu'il arrive.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels: ["dependencies"]
    groups:
      # Un lot par famille : une PR à relire, pas quinze.
      cypress:
        patterns: ["cypress", "@cypress/*", "cypress-*"]
      vite-build:
        patterns: ["vite", "@vitejs/*", "vitest", "rollup", "esbuild", "postcss"]
      babel:
        patterns: ["@babel/*", "babel-*"]
      mui:
        patterns: ["@mui/*", "@emotion/*"]
      types:
        patterns: ["@types/*"]
      lint:
        patterns: ["eslint", "eslint-*", "@typescript-eslint/*", "prettier"]
    # Pas de groupe `applies-to: security-updates`. Un groupe fourre-tout
    # produit une PR unique où une montée majeure risquée se cache au milieu
    # de neuf correctifs anodins — c'est exactement ce qui est arrivé avec la
    # PR #12 (uuid 8 -> 14 et http-proxy-middleware 0.19 -> 2.x noyés dans 11
    # mises à jour). Les correctifs de sécurité arrivent donc un par un :
    # plus bruyant, mais chaque majeure est relisible seule.
    ignore:
      # ATTENTION — une condition `ignore` assortie de `update-types` ne
      # s'applique QU'AUX mises à jour de version. Dependabot ignore ce filtre
      # pour les mises à jour de sécurité. Ces trois lignes empêchent donc les
      # majeures de revenir chaque semaine par le canal « version », mais elles
      # n'empêchent PAS une majeure d'arriver par le canal « sécurité ».
      # C'est voulu : une faille dans passport ou uuid doit remonter, même si
      # le correctif impose une majeure. Elle arrivera seule, donc relisible.
      - dependency-name: "passport*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "http-proxy-middleware"
        update-types: ["version-update:semver-major"]
      - dependency-name: "uuid"
        update-types: ["version-update:semver-major"]
      # Les typages de Node doivent suivre le runtime, pas le registre. La
      # version exécutée est figée par `.node-version` (22.20.0) et par l'image
      # de la CI ; `@types/node` en 26 décrirait des API absentes à l'exécution
      # et laisserait compiler du code qui plante. La PR #17 proposait ^26.4.0 —
      # elle passait le typecheck, ce qui est précisément le problème.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: ["ci"]
    # Les actions sont épinglées par SHA (quality gate §6 d'ARCHITECTURE.md).
    # Dependabot sait mettre à jour un SHA épinglé en conservant l'épinglage.
